name: Network test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Runner public IP
        run: curl -s https://api.ipify.org; echo
      - name: Try broker
        env:
          H: ${{ secrets.MQTT_BROKER }}
          P: ${{ secrets.MQTT_PORT }}
        run: |
          echo "host length: ${#H}"
          for i in 1 2 3; do timeout 10 bash -c "echo > /dev/tcp/$H/$P" && echo "OPEN" && break || echo "attempt $i failed"; done