name: Daily solar report
# MANUAL ONLY now. The always-on service (scripts/service.py) collects all day and sends the 18:00 email.
# Keep this workflow as a backup / for one-off tests.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = collect + report + email,  collect-only = just collect"
        type: choice
        options: [full, collect-only]
        default: full
      date:
        description: "IST date to report (YYYY-MM-DD). Empty = today"
        required: false
permissions:
  contents: write                 # to save data/raw back to the (PRIVATE) repo
concurrency: { group: solar-report, cancel-in-progress: false }   # never two connections at once
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YALGAAR_CLIENT_KEY: ${{ secrets.YALGAAR_CLIENT_KEY }}
      YALGAAR_UUID:       ${{ vars.YALGAAR_UUID || 'solarpulse-gha' }}   # must differ from the PC's uuid
      YALGAAR_CHANNEL:    ${{ vars.YALGAAR_CHANNEL }}                    # empty = LOGGER_SERIAL
      YALGAAR_SSL:        ${{ vars.YALGAAR_SSL || 'false' }}
      YALGAAR_PERSISTENT: ${{ vars.YALGAAR_PERSISTENT || 'true' }}
      YALGAAR_HISTORY:    ${{ vars.YALGAAR_HISTORY || '100' }}
      LOGGER_SERIAL:      ${{ secrets.LOGGER_SERIAL }}
      CLIENT_NAME:   ${{ vars.CLIENT_NAME }}
      PLANT_ADDRESS: ${{ vars.PLANT_ADDRESS }}
      PLANT_ID:      ${{ vars.PLANT_ID }}
      INVERTER:      ${{ vars.INVERTER }}
      PLANT_KWP:     ${{ vars.PLANT_KWP }}
      TARIFF_INR:    ${{ vars.TARIFF_INR || '7' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO:   ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide what this run does
        id: mode
        run: |
          FINAL=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "15 13 * * *" ]; then FINAL=true; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" != "collect-only" ]; then FINAL=true; fi
          echo "final=$FINAL" >> "$GITHUB_OUTPUT"; echo "final run: $FINAL"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Install Chromium (report runs only)
        if: steps.mode.outputs.final == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Collect
        id: build
        run: |
          D="${{ github.event.inputs.date }}"
          if [ "${{ steps.mode.outputs.final }}" = "true" ]; then
            python scripts/run_daily.py --keep-going ${D:+--date $D}
            echo "html=$(ls -t out/solar_report_*.html | head -1)" >> "$GITHUB_OUTPUT"
          else
            python scripts/run_daily.py --collect-only
          fi
      - name: PDF copy
        if: steps.mode.outputs.final == 'true'
        run: |
          H="${{ steps.build.outputs.html }}"
          python scripts/html_to_pdf.py "$H" "${H%.html}.pdf"
      - name: Send email
        if: steps.mode.outputs.final == 'true'
        run: |
          H="${{ steps.build.outputs.html }}"
          python scripts/send_email.py "$H" "${H%.html}.pdf"
      - name: Save data (private repo)
        if: always()
        run: |
          git config user.name "solar-bot"; git config user.email "solar-bot@users.noreply.github.com"
          git add data/raw 2>/dev/null || true
          (git diff --cached --quiet || git commit -m "data $(date -u +%F-%H%M)") && git pull --rebase -q && git push || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: report, path: out/, retention-days: 30, if-no-files-found: ignore }
