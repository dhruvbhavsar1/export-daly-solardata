name: Broker login test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      H: ${{ secrets.MQTT_BROKER }}
      P: ${{ secrets.MQTT_PORT }}
      U: ${{ secrets.MQTT_USERNAME }}
      W: ${{ secrets.MQTT_PASSWORD }}
      S: ${{ secrets.LOGGER_SERIAL }}
    steps:
      - run: pip install paho-mqtt
      - name: Try several client ids
        run: |
          python - <<'PY'
          import os, time, paho.mqtt.client as mqtt
          H, P, U, W, S = (os.environ[k].strip() for k in "H P U W S".split())
          print("paho", mqtt.__version__, "| host_len", len(H), "| port", P, "| user_len", len(U), "| pass_len", len(W))
          combos = [("solarpulse_gha_" + S, False), ("solarpulse_gha_" + S, True),
                    ("solar_raw_gha_" + S, False), ("solar_raw_gha_" + S, True),
                    ("gha_test_1", True), ("solarbot", True)]
          for cid, clean in combos:
              res = {}
              c = mqtt.Client(mqtt.CallbackAPIVersion.VERSION2, client_id=cid, clean_session=clean)
              c.username_pw_set(U, W)
              def oc(cl, ud, fl, rc, pr=None): res["rc"] = str(rc)
              c.on_connect = oc
              try:
                  c.connect(H, int(P), 60); c.loop_start(); t = time.time()
                  while "rc" not in res and time.time() - t < 8: time.sleep(0.2)
              except Exception as e:
                  res["rc"] = "EXC " + str(e)
              print(f"id={cid[:22]:22} clean={str(clean):5} -> {res.get('rc', 'no answer')}", flush=True)
              c.loop_stop(); c.disconnect(); time.sleep(1)
          PY